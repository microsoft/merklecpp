name: Continuous Integration

on:
  push:
    branches:
      - main
      - 'releases/**'
    tags:
      - 'merklecpp-*'
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [Debug, Release]
        compiler: [g++, clang++]
        openssl: ['OFF', 'ON']
        include:
          - os: windows-latest
            build_type: Debug
            compiler: msvc
            openssl: 'OFF'
          - os: windows-latest
            build_type: Release
            compiler: msvc
            openssl: 'OFF'

    steps:
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get -y install clang clang-tidy
      if: matrix.os == 'ubuntu-latest'

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build/${{ matrix.build_type }}

    - name: Detect Runner Parallelism
      shell: bash
      run: cmake -P "$GITHUB_WORKSPACE/.github/processor_count.cmake"

    - name: Configure CMake
      # Use a bash shell so we can use the same syntax for environment variable
      # access regardless of the host operating system
      shell: bash
      working-directory: ${{github.workspace}}/build/${{ matrix.build_type }}
      run: |
        long_tests=OFF
        if [ "${{ matrix.build_type }}" == "Release" ]; then
          long_tests=ON
        fi
        if [ "$RUNNER_OS" == "Linux" ]; then
          cmake $GITHUB_WORKSPACE -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DTESTS=ON -DLONG_TESTS=$long_tests -DOPENSSL=${{ matrix.openssl }} -DCLANG_TIDY=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        else
          cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DTESTS=ON -DLONG_TESTS=$long_tests -DOPENSSL=${{ matrix.openssl }}
        fi

    - name: Build
      working-directory: ${{github.workspace}}/build/${{ matrix.build_type }}
      shell: bash
      run: cmake --build . --config ${{ matrix.build_type }} --parallel "$PARALLELISM"

    - name: Clang-Tidy Header
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        clang-tidy merklecpp.h -p build/${{ matrix.build_type }} --warnings-as-errors='*'
        clang-tidy merklecpp_tiles.h -p build/${{ matrix.build_type }} --warnings-as-errors='*'
        clang-tidy merklecpp_pal.h -p build/${{ matrix.build_type }} --warnings-as-errors='*'

    - name: Test
      working-directory: ${{github.workspace}}/build/${{ matrix.build_type }}
      shell: bash
      run: ctest -VV -C ${{ matrix.build_type }} --timeout 300 --parallel "$PARALLELISM"
      env: 
        ASAN_OPTIONS: use_sigaltstack=false # To avoid SetAlternateSignalStack with clang-11 
