name: Continuous Integration

on:
  push:
    branches:
      - main
      - 'releases/**'
    tags:
      - 'merklecpp-*'
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [Debug, Release]
        compiler: [g++, clang++]
        openssl: ['OFF', 'ON']
        include:
          - os: windows-latest
            build_type: Debug
            compiler: msvc
            openssl: 'OFF'
          - os: windows-latest
            build_type: Release
            compiler: msvc
            openssl: 'OFF'

    steps:
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get -y install clang clang-tidy
      if: matrix.os == 'ubuntu-latest'

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build/${{ matrix.build_type }}

    - name: Detect Runner Parallelism
      shell: bash
      run: cmake -P "$GITHUB_WORKSPACE/.github/processor_count.cmake"

    - name: Configure CMake
      # Use a bash shell so we can use the same syntax for environment variable
      # access regardless of the host operating system
      shell: bash
      working-directory: ${{github.workspace}}/build/${{ matrix.build_type }}
      run: |
        long_tests=OFF
        if [ "${{ matrix.build_type }}" == "Release" ]; then
          long_tests=ON
        fi

        fuzzing=OFF
        if [ "${{ matrix.build_type }}" == "Debug" ] \
          && [ "${{ matrix.compiler }}" == "clang++" ] \
          && [ "${{ matrix.openssl }}" == "OFF" ]; then
          fuzzing=ON
        fi

        linux_options=()
        if [ "$RUNNER_OS" == "Linux" ]; then
          linux_options=(
            "-DCMAKE_CXX_COMPILER=${{ matrix.compiler }}"
            -DCLANG_TIDY=ON
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          )
        fi

        cmake "$GITHUB_WORKSPACE" \
          "-DCMAKE_BUILD_TYPE=${{ matrix.build_type }}" \
          "-DLONG_TESTS=$long_tests" \
          "-DOPENSSL=${{ matrix.openssl }}" \
          "-DFUZZING=$fuzzing" \
          "${linux_options[@]}"

    - name: Build
      working-directory: ${{github.workspace}}/build/${{ matrix.build_type }}
      shell: bash
      run: cmake --build . --config ${{ matrix.build_type }}

    - name: Clang-Tidy Header
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        clang-tidy merklecpp.h -p build/${{ matrix.build_type }} --warnings-as-errors='*'
        clang-tidy merklecpp_tiles.h -p build/${{ matrix.build_type }} --warnings-as-errors='*'
        clang-tidy merklecpp_pal.h -p build/${{ matrix.build_type }} --warnings-as-errors='*'

    - name: Test
      working-directory: ${{github.workspace}}/build/${{ matrix.build_type }}
      shell: bash
      run: ctest -VV -C ${{ matrix.build_type }} --timeout 300 -E '^time_tiles$'

    - name: Run tile benchmark
      if: matrix.build_type == 'Release'
      working-directory: ${{github.workspace}}/build/${{ matrix.build_type }}
      shell: bash
      run: |
        set -o pipefail
        ctest -VV -C ${{ matrix.build_type }} --timeout 300 -R '^time_tiles$' \
          2>&1 | tee time_tiles-output.txt

    - name: Publish tile benchmark summary
      if: always() && matrix.build_type == 'Release'
      working-directory: ${{github.workspace}}/build/${{ matrix.build_type }}
      shell: bash
      run: |
        if [ ! -f time_tiles-output.txt ]; then
          echo "The time_tiles benchmark did not run." >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        results=$(
          sed -n -E \
            '/^[[:space:]]*[0-9]+: (seed=|append[[:space:]]|flush[[:space:]]|inclusion[[:space:]]|consistency|compact[[:space:]]|time_tiles:)/ {
              s/^[[:space:]]*[0-9]+: //
              p
            }' \
            time_tiles-output.txt
        )

        if ! grep -q '^time_tiles: OK' <<< "$results"; then
          echo "The time_tiles benchmark did not produce a complete result." \
            >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        seed=$(sed -n 's/^seed=//p' <<< "$results")
        {
          echo "## Tiled-storage performance"
          echo
          echo "| Configuration | Value |"
          echo "|---|---|"
          echo "| Runner | \`${{ matrix.os }}\` |"
          echo "| Architecture | \`${{ runner.arch }}\` |"
          echo "| Compiler | \`${{ matrix.compiler }}\` |"
          echo "| OpenSSL | \`${{ matrix.openssl }}\` |"
          echo "| Commit | \`${GITHUB_SHA}\` |"
          echo "| Seed | \`${seed}\` |"
          echo
          echo "| Operation | Result |"
          echo "|---|---|"
        } >> "$GITHUB_STEP_SUMMARY"

        while IFS= read -r line; do
          case "$line" in
            seed=*|time_tiles:*)
              continue
              ;;
          esac
          operation=${line%%:*}
          result=${line#*:}
          operation=$(sed 's/^[[:space:]]*//;s/[[:space:]]*$//' <<< "$operation")
          result=$(sed 's/^[[:space:]]*//;s/[[:space:]]*$//' <<< "$result")
          printf '| `%s` | %s |\n' "$operation" "$result" \
            >> "$GITHUB_STEP_SUMMARY"
        done <<< "$results"
